        <header>
          <h1 style="color: #96ff3f; font-size: 2.2rem; margin-bottom: 0.5rem;">Termalime — The High-Performance Terminal with Built-in Local AI</h1>
          <p style="font-size: 1.15rem; color: #a1a1aa; line-height: 1.6;">
            Termalime is a free, 100% open-source desktop cockpit fusing a blazing-fast pseudo-terminal (PTY) emulator with an offline local AI copilot (powered by Ollama). Built on Tauri 2.x and Rust for zero latency, zero cloud subscription fees, and complete prompt privacy.
          </p>
        </header>

        <section style="margin: 2rem 0;">
          <h2 style="color: #38bdf8; font-size: 1.5rem;">✨ Latest Features in v0.6.0 Codename Bridge</h2>
          <ul style="line-height: 1.8; color: #e4e4e7;">
            <li><strong>Interactive AI Code Blocks:</strong> Direct action buttons on AI-generated shell snippets — <em>Run in Terminal</em> (safeguarded by Preflight), <em>Insert at Prompt</em>, and <em>Copy Code</em>.</li>
            <li><strong>1-Click Output &amp; Error Diagnosis (Ctrl+Shift+E):</strong> Captures recent terminal tracebacks and diagnoses failure causes with proposed command fixes.</li>
            <li><strong>In-Buffer Terminal Search (Ctrl+F):</strong> Integrated search overlay with incremental find, match navigation, and case-sensitivity toggle.</li>
            <li><strong>Smart Tabs:</strong> New tabs automatically inherit current working directory (CWD) and support in-place renaming via double-click.</li>
            <li><strong>24-Bit Truecolor Support:</strong> Native <code>COLORTERM=truecolor</code> support for modern tools (<code>bat</code>, <code>eza</code>, <code>starship</code>).</li>
            <li><strong>Preflight Security Checker:</strong> Intercepts destructive commands (e.g., <code>rm -rf /</code>, piped <code>curl | sh</code>) before execution with AI-backed risk reasoning.</li>
            <li><strong>Live Telemetry Context Bar:</strong> Real-time hardware telemetry (CPU, Memory), Git branch, local IP, and CWD.</li>
          </ul>
        </section>
