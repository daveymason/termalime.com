# Netlify Configuration for termalime.com
[build]
  command = "npm run build"
  publish = "dist"

# Redirect legacy WordPress hello-world and sample pages to homepage
[[redirects]]
  from = "/hello-world"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/hello-world/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/sample-page"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/sample-page/"
  to = "/"
  status = 301
  force = true

# Block WordPress probes with 404
[[redirects]]
  from = "/wp-*"
  to = "/"
  status = 404
  force = true

# Single Page Application fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Strict Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache immutable static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
